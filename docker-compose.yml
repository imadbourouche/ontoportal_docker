x-app: &app
  environment: &env
    API_URL: http://127.0.0.1:9393
    BUNDLE_PATH: /srv/ontoportal/bundle
    COVERAGE: "true"
    REDIS_HOST: 127.0.0.1
    REDIS_GOO_CACHE_HOST: 127.0.0.1
    REDIS_HTTP_CACHE_HOST: 127.0.0.1
    REDIS_PERSISTENT_HOST: 127.0.0.1
    REDIS_PORT: 6379
    SOLR_TERM_SEARCH_URL: http://127.0.0.1:8983/solr
    SOLR_PROP_SEARCH_URL: http://127.0.0.1:8983/solr
    GOO_BACKEND_NAME: 4store
    GOO_PORT: 9000
    GOO_HOST: 127.0.0.1
    MGREP_HOST: 127.0.0.1
    MGREP_PORT: 55555
    REPOSITORY_FOLDER: /srv/ontoportal/data/repository
    REPORT_PATH: /srv/ontoportal/data/reports/ontologies_report.json
    MGREP_DICTIONARY_FILE: /srv/ontoportal/data/mgrep
    BUNDLE_APP_CONFIG: /srv/ontoportal/ontologies_api/.bundle
  stdin_open: true
  tty: true
  command: /bin/bash


x-ui_app: &ui_app
