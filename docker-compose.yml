    ORG_URL: http://www.lirmm.fr
    UI_URL: http://127.0.0.1:3000
    API_URL: http://127.0.0.1:9393
    API_KEY: 1de0a270-29c5-4dda-b043-7c3580628cd5
    UI_THEME: ontoportal
    TWITTER_NEWS: ""
    BIOMIXER_URL: ""
    BIOMIXER_APIKEY: ""
    ANNOTATOR_URL: "/annotator"
    FAIRNESS_DISABLED: "false"
    FAIRNESS_URL: "http://127.0.0.1:5000/fairness-assessment"
    NCBO_ANNOTATORPLUS_ENABLED: "false"
    NCBO_ANNOTATOR_URL: ""
    NCBO_API_KEY: ""
    SUPPORT_EMAIL: sifrportal-support@lirmm.fr
    RELEASE_VERSION: "OntoPortal Appliance 3.0.1"
    ANALYTICS_ID: ""
    USE_RECAPTCHA: "false"
    DB_HOST: 127.0.0.1
    CACHE_HOST: 127.0.0.1
    RAILS_ENV: "production"
    BUNDLE_WITHOUT: "development test"
    BUNDLE_PATH: "/usr/local/bundle"
    BIOPORTAL_WEB_UI_DATABASE_PASSWORD: root
    MEMCACHE_SERVERS: "127.0.0.1:11211"
    # SECRET_KEY_BASE: "my-secret-base-132146574684"
    # RAILS_MASTER_KEY: "my-rails-master-key-132146574684"
  volumes:
    - node:/node_modules
    - app_ui:/app
    - bundle:/srv/ontoportal/bundle
    - rails_cache:/app/tmp/cache
    - assets:/app/public/assets
  tmpfs:
    - /tmp
    - /app/tmp/pids
  tty: true


services:
  api-prod:
    image: agroportal/ontologies_api:master
    environment:
      <<: *env
    depends_on:
      solr-ut:
        condition: service_healthy
      redis-ut:
        condition: service_healthy
      mgrep-ut:
        condition: service_started
      4store-ut:
        condition: service_started
      ncbo_cron:
        condition: service_started
    network_mode: "host"
    volumes:
      - app_api:/srv/ontoportal/ontologies_api
      - repository:/srv/ontoportal/data/repository
    command: >
      sh -c "rm -fr tmp/pids/unicorn.pid && (bundle check || bundle install) && bundle exec unicorn -c config/unicorn.rb -E production -l 9393"
    stdin_open: true
    tty: true
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9393" ]
      interval: 30s
      timeout: 10s
      retries: 5
    
  ncbo_cron:
    <<: *app
    image: agroportal/ncbo_cron:master
    environment:
      <<: *env
    command: >
      sh -c 'bundle exec bin/ncbo_cron'
    volumes:
      - app_cron:/srv/ontoportal/ncbo_cron
      - repository:/srv/ontoportal/data/repository
      - history:/usr/local/hist
      - reports:/srv/ontoportal/data/reports
      - mgrep:/srv/ontoportal/data/mgrep
      - logs:/srv/ontoportal/ncbo_cron/logs
    depends_on:
      solr-ut:
        condition: service_healthy
      redis-ut:
        condition: service_healthy
      mgrep-ut:
        condition: service_started
      4store-ut:
        condition: service_started
    network_mode: "host"


  mgrep-ut:
    image: ontoportal/mgrep-ncbo:0.1
    network_mode: "host"

  redis-ut:
    image: redis
    network_mode: "host"
    command: [ "redis-server", "--save", "", "--appendonly", "no" ]
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 10

  4store-ut:
    image: bde2020/4store
    network_mode: "host"
    volumes:
      - ./4store_repository:/var/lib/4store
    command: >
      bash -c "if [ ! -d '/var/lib/4store/ontoportal_kb' ]; then 4s-backend-setup --segments 4 ontoportal_kb; fi ; 4s-backend ontoportal_kb ; 4s-httpd -D -s-1 -p 9000 ontoportal_kb"

  solr-ut:
    image: solr:8
    network_mode: "host"
    command: bin/solr start -cloud -f
    volumes:
      - solr_data:/var/solr/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8983/solr/admin/info/system?wt=json" ]
      interval: 30s
      timeout: 10s
      retries: 3


  # For the UI
  ui-prod:
    <<: *ui_app
    environment:
      <<: *ui_env
    command: >
      sh -c "(bundle check || bundle install) && bin/rails secret && EDITOR='nano' bin/rails credentials:edit && bin/rails db:prepare && bundle exec puma -C config/puma.rb"
    network_mode: "host"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
      node:
        condition: service_started
      api-prod:
        condition: service_healthy
  node:
    <<: *ui_app
    environment:
      <<: *ui_env
    network_mode: "host"
    command: "yarn build --watch"
    depends_on:
      - db
      - cache

  db:
    image: "mysql:8.0"
    volumes:
      - mysql-data:/var/lib/mysql
    network_mode: "host"
    environment:
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 5s
      retries: 3

  cache:
    image: memcached:latest
    restart: unless-stopped
    command: [ "-m", "1024" ]
    network_mode: "host"


volumes:
  app_api:
  app_cron:
  agdata:
  4store:
  repository:
  solr_data:
  reports:
  mgrep:
  logs:
  history:

  # Ui volumes
  mysql-data:
  bundle:
  rails_cache:
  assets:
  node:
  app_ui: